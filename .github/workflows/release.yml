# Builds both apps on Linux and Windows and publishes them as a GitHub release on every push to main.
# Work on the `dev` branch (no workflow runs); merging into main publishes a new release.
#
# Each release is tagged v<MAJOR_MINOR>.<run number>, e.g. v0.1.7. Bump MAJOR_MINOR by hand for bigger releases.
# OpenTUI has a native core, so each platform is built on its own runner (no cross-compiling).
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "TODO.md"
  workflow_dispatch:

env:
  MAJOR_MINOR: "0.1"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            ext: ""
          - os: windows-latest
            platform: windows-x64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Typecheck and test
        run: |
          bun run --cwd packages/core typecheck
          bun run --cwd packages/core test
          bun run --cwd packages/opentui-accordion typecheck
          bun run --cwd apps/host-app typecheck
          bun run --cwd apps/client-app typecheck
      - name: UI tests (OpenTUI needs its native core, Linux runner only)
        if: runner.os == 'Linux'
        run: |
          bun run --cwd packages/opentui-accordion test
          bun run --cwd apps/client-app test
      - name: Build apps
        run: |
          bun run --cwd apps/host-app build
          bun run --cwd apps/client-app build
      - name: Collect assets
        run: |
          mkdir -p release
          cp "apps/host-app/dist/homelab-tui${{ matrix.ext }}" "release/homelab-tui-${{ matrix.platform }}${{ matrix.ext }}"
          cp "apps/client-app/dist/hl${{ matrix.ext }}" "release/hl-${{ matrix.platform }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MAJOR_MINOR }}.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.MAJOR_MINOR }}.${{ github.run_number }}
          make_latest: true
          files: release/*
          generate_release_notes: true
